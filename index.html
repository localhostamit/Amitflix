
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Amitflix</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- FONTS & ICONS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script> <!-- Auth Added -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        :root { 
            --primary: #E50914; 
            --bg: #050505; 
            --surface: #121212;
            --text: #ffffff;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* --- ADMIN VISIBILITY LOGIC --- */
        body:not(.is-admin) .admin-only { display: none !important; }
        body.is-admin #login-btn { display: none !important; }
        body:not(.is-admin) #logout-btn { display: none !important; }

        /* --- INTRO --- */
        #intro-overlay {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeOutIntro 0.5s ease 3.2s forwards;
            pointer-events: none;
        }
        .intro-letter {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 15rem; color: var(--primary); position: relative;
            transform: scale(1);
            animation: netflixZoom 3s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        }
        .intro-letter::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, transparent 45%, rgba(0,0,0,0.5) 50%, transparent 55%);
            filter: blur(4px);
        }
        @keyframes netflixZoom {
            0% { transform: scale(1); opacity: 0; } 20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1.5); } 100% { transform: scale(30); opacity: 0; }
        }
        @keyframes fadeOutIntro { 99% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

        /* --- LOADER --- */
        #app-loader { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999; display:flex; align-items:center; justify-content:center; flex-direction: column; transition: opacity 0.5s; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;}
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- NAVBAR --- */
        header { 
            position: fixed; top: 0; width: 100%; height: 70px; z-index: 2000; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 5%; transition: 0.3s ease;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }
        header.scrolled { background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px); }
        .logo { color: var(--primary); font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; text-shadow: 0 0 20px rgba(229,9,20,0.5); cursor:pointer; }
        
        .nav-icons { display: flex; align-items: center; }
        .nav-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); cursor: pointer; margin-left: 10px; transition: 0.2s; }
        .nav-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        .nav-btn i { color: white; font-size: 18px; }

        /* --- HERO --- */
        .hero { 
            height: 70vh; width: 100%; position: relative; 
            background-size: cover; background-position: center; 
            display: flex; align-items: flex-end;
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        .hero::after { content:''; position: absolute; inset:0; background: linear-gradient(to top, var(--bg) 0%, transparent 60%); }
        .hero-content { position: relative; z-index: 10; padding: 0 5% 60px 5%; width: 100%; }
        .hero-tag { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--primary); margin-bottom: 10px; display: inline-block; background: rgba(229, 9, 20, 0.2); padding: 4px 8px; border-radius: 4px; }
        .hero-title { font-size: clamp(32px, 8vw, 65px); font-weight: 900; margin: 0; line-height: 1; margin-bottom: 15px; }
        .hero-desc { font-size: 14px; color: #ccc; max-width: 600px; line-height: 1.5; margin-bottom: 25px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-play { padding: 12px 30px; background: white; color: black; border: none; font-weight: 800; border-radius: 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.2s; }
        .btn-play:active { transform: scale(0.95); }

        /* --- SECTIONS --- */
        .section { padding: 0 5%; margin-bottom: 40px; position: relative; z-index: 20; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-title { font-size: 18px; font-weight: 700; color: white; border-left: 3px solid var(--primary); padding-left: 10px; }
        
        .h-list { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; min-height: 180px; align-items: center; }
        .v-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; row-gap: 30px; }

        .poster-card { position: relative; flex-shrink: 0; transition: 0.3s; cursor: pointer; width: 120px; }
        .v-grid .poster-card { width: 100%; }
        .h-list .poster-card { width: 130px; }
        
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; background: var(--surface); transition: transform 0.2s; }
        .poster:active { transform: scale(0.95); }
        .poster-badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.8); color: var(--primary); font-size: 9px; padding: 3px 6px; border-radius: 4px; font-weight: 800; }
        
        .delete-btn {
            position: absolute; top: -8px; right: -8px; 
            width: 26px; height: 26px; background: #E50914; border: 2px solid #fff; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 12px; z-index: 50; cursor: pointer; box-shadow: 0 2px 5px black;
        }

        /* --- MODALS --- */
        .modal { display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-box { background: #141414; width: 100%; max-width: 500px; padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); max-height: 85vh; overflow-y: auto; }
        input, select { width: 100%; padding: 16px; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 12px; font-size: 15px; margin-bottom: 15px; }
        .btn-action { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* --- SERIES VIEW --- */
        .series-view { position: fixed; inset: 0; background: var(--bg); z-index: 6000; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); overflow-y: auto; }
        .series-view.active { transform: translateY(0); }
        .series-backdrop { height: 45vh; width: 100%; background-size: cover; background-position: center; position: relative; flex-shrink: 0; mask-image: linear-gradient(to bottom, black 60%, transparent 100%); }
        .close-series { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; cursor: pointer; backdrop-filter: blur(10px); }
        .series-content { padding: 0 25px 50px 25px; margin-top: -80px; position: relative; z-index: 2; }
        .ep-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: var(--surface); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; position: relative; }
        .ep-delete { position: absolute; right: 10px; top: 10px; color: #666; font-size: 14px; padding: 10px; }

        /* --- PLAYER --- */
        #player { background: black; z-index: 9999; display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; }
        #vid-con { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        video, iframe { width: 100%; height: 100%; border: none; }
        #player-toolbar { position: absolute; top: 25px; right: 25px; display: flex; align-items: center; gap: 20px; background: rgba(10,10,10,0.8); padding: 10px 20px; border-radius: 30px; backdrop-filter: blur(15px); }
        #player-close { position: absolute; top: 25px; left: 25px; width: 45px; height: 45px; background: rgba(10,10,10,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; backdrop-filter: blur(15px); }
    </style>
</head>
<body>

<div id="intro-overlay"><div class="intro-letter">A</div></div>
<div id="app-loader"><div class="spinner"></div></div>

<header id="navbar">
    <div class="logo" onclick="window.scrollTo(0,0)">AMITFLIX</div>
    <div class="nav-icons">
        
        <!-- ADMIN CONTROLS -->
        <div class="nav-btn admin-only" onclick="openModal('add-modal')"><i class="fas fa-plus"></i></div>
        
        <!-- LOGIN / LOGOUT -->
        <div class="nav-btn" id="login-btn" onclick="openLoginModal()"><i class="fas fa-lock"></i></div>
        <div class="nav-btn" id="logout-btn" onclick="firebaseLogout()"><i class="fas fa-lock-open" style="color:var(--primary);"></i></div>
        
    </div>
</header>

<div class="hero" id="hero">
    <div class="hero-content">
        <span class="hero-tag" id="hero-tag">FEATURED</span>
        <h1 class="hero-title" id="hero-title">Welcome</h1>
        <p class="hero-desc" id="hero-desc">Your personal library is ready.</p>
        <button onclick="playHero()" id="hero-play" class="btn-play" style="display:none;"><i class="fas fa-play"></i> Watch Now</button>
    </div>
</div>

<!-- TRENDING (Admin Only) -->
<div class="section admin-only" style="margin-top: -40px;">
    <div class="section-header">
        <span class="section-title">🔥 Top Sci-Fi & Superheroes</span>
        <i class="fas fa-sync-alt" onclick="window.loadWebTrending()" style="color:#666; cursor:pointer;" title="Retry"></i>
    </div>
    <div class="h-list" id="web-trending"></div>
</div>

<!-- MY COLLECTION -->
<div class="section">
    <div class="section-header">
        <span class="section-title">📂 My Collection</span>
        <i class="fas fa-sync-alt" onclick="loadLib()" style="color:#666; cursor:pointer;"></i>
    </div>
    <div class="v-grid" id="grid-list"></div>
    <div id="empty-state" style="text-align:center; padding: 40px; color:#666; display:none;">No content added.</div>
</div>

<!-- LOGIN MODAL -->
<div id="login-modal" class="modal">
    <div class="modal-box" style="text-align:center; max-width:350px;">
        <h3 style="margin-top:0;">Admin Login</h3>
        <input type="email" id="email-input" placeholder="Email (admin@amitflix.com)">
        <input type="password" id="password-input" placeholder="Password">
        <button class="btn-action" onclick="firebaseLogin()">Sign In</button>
        <div style="margin-top:15px; font-size:12px; color:#666; cursor:pointer;" onclick="closeModal('login-modal')">Cancel</div>
    </div>
</div>

<!-- ADD MODAL -->
<div id="add-modal" class="modal">
    <div class="modal-box">
        <h2 style="margin-top:0;">Add Content</h2>
        <div style="display:flex; gap:10px;">
            <select id="add-type"><option value="movie">Movie</option><option value="series">TV Series</option></select>
        </div>
        
        <div id="add-search-ui" style="display:flex; gap:10px;">
            <input id="search-q" placeholder="Search Title...">
            <button class="btn-action" onclick="searchContent()" style="width:auto;"><i class="fas fa-search"></i></button>
        </div>
        <div id="search-res" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:10px;"></div>
        
        <div id="step-2" style="display:none; margin-top:15px;">
            <p style="color:#aaa; font-size:13px;">Adding: <b id="sel-title" style="color:white"></b></p>
            <div id="movie-options">
                <input id="vid-link" placeholder="Paste Link (MP4/Drive)">
            </div>
            <div id="series-msg" style="display:none; background:#222; padding:10px; border-radius:8px; font-size:13px; color:#ccc;">Creates a Series Folder.</div>
            
            <button class="btn-action" onclick="saveToDB()">Save to Library</button>
            <div style="text-align:center; margin-top:10px; font-size:12px; color:#666; cursor:pointer;" onclick="resetAddModal()">Cancel / Back</div>
        </div>
        <i class="fas fa-times" onclick="closeModal('add-modal')" style="position:absolute; top:20px; right:20px; color:#888; cursor:pointer; font-size:20px;"></i>
    </div>
</div>

<!-- SERIES VIEW -->
<div id="series-view" class="series-view">
    <div class="series-backdrop" id="s-backdrop"><div class="close-series" onclick="closeSeriesView()"><i class="fas fa-chevron-down"></i></div></div>
    <div class="series-content">
        <h1 class="series-title" id="s-title">Title</h1>
        <p id="s-desc" style="color:#aaa; line-height:1.5; font-size:14px;">...</p>
        
        <!-- Add Episode (Admin Only) -->
        <div class="admin-only" style="background:#1a1a1a; padding:15px; border-radius:12px; margin:20px 0;">
            <h4 style="margin:0 0 10px 0;">Add Episode</h4>
            <div style="display:flex; gap:10px;">
                <select id="s-season" onchange="fetchTMDbEpisodes()"></select>
                <select id="s-ep"><option>Ep...</option></select>
            </div>
            <input id="s-link" placeholder="Link">
            <button class="btn-action" onclick="saveEp()">Add</button>
        </div>
        
        <h3>Episodes</h3>
        <div id="ep-list" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<!-- PLAYER -->
<div id="player">
    <div id="player-close" onclick="closePlayer()"><i class="fas fa-arrow-left"></i></div>
    <div id="vid-con"></div>
    <div id="player-toolbar">
        <i class="fas fa-sun" style="color:white; font-size:14px;"></i>
        <input type="range" min="0.3" max="1.5" step="0.1" value="1" oninput="setBrightness(this.value)" style="width:80px; margin:0;">
        <i class="fas fa-expand" onclick="toggleFit()" style="color:white; font-size:16px; cursor:pointer;"></i>
    </div>
</div>

<script type="module">
    window.addEventListener('click', () => {
        const audio = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
        audio.play().catch(()=>{});
    }, { once: true });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // VARS
    const OMDB_KEY = "496d1395"; 
    const TMDB_KEY = "3fd2be6f0c70a2a598f084ddfb75487c";
    let db, storage, moviesCol, auth, activeSeriesID, activeTmdbID, allMovies=[], tempItem=null;

    const firebaseConfig = {
      apiKey: "AIzaSyBDZyw3vWpTuo3wKBFCtqqlbQfx1jHHqmc",
      authDomain: "movietheater-free.firebaseapp.com",
      projectId: "movietheater-free",
      storageBucket: "movietheater-free.firebasestorage.app",
      messagingSenderId: "632877715870",
      appId: "1:632877715870:web:de263eac9c902b5199c68f"
    };

    try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        storage = getStorage(app);
        moviesCol = collection(db, "movies");
        
        // AUTH LISTENER (AUTO UI UPDATE)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.body.classList.add("is-admin");
                console.log("Admin logged in:", user.email);
            } else {
                document.body.classList.remove("is-admin");
                console.log("Visitor mode");
            }
        });

        loadLib();
        loadWebTrending();
        
        setTimeout(() => document.getElementById("app-loader")?.remove(), 2500);
    } catch(e) { console.error("Firebase Error:", e); }

    // --- AUTHENTICATION UI ---
    window.openLoginModal = () => window.openModal('login-modal');
    
    window.firebaseLogin = async () => {
        const email = document.getElementById("email-input").value;
        const pass = document.getElementById("password-input").value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            window.closeModal('login-modal');
            alert("Welcome Admin!");
        } catch(e) { alert("Login Failed: " + e.message); }
    }

    window.adminLogout = async () => {
        await signOut(auth);
        alert("Logged Out");
        location.reload();
    }

    // --- FETCH WEB TRENDING ---
    async function loadWebTrending() {
        const list = document.getElementById("web-trending");
        const targetUrl = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=878,28&sort_by=popularity.desc`;
        const proxies = [
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        let data = null;
        for (const proxy of proxies) {
            try {
                const res = await fetch(proxy(targetUrl));
                if (res.ok) { data = await res.json(); break; }
            } catch(e) {}
        }

        if (!data || !data.results) {
            list.innerHTML = `<div style="text-align:center; padding:20px; color:#666; font-size:12px;">Failed to load trending.</div>`;
            return;
        }
        
        list.innerHTML = "";
        data.results.slice(0, 10).forEach(m => {
            const d = document.createElement("div");
            d.className = "poster-card";
            const safeTitle = m.title.replace(/'/g, "");
            const safeOverview = m.overview.replace(/'/g, "").replace(/"/g, "");
            d.innerHTML = `
                <div class="poster-badge" style="background:#E50914;">HOT</div>
                <img src="https://image.tmdb.org/t/p/w200${m.poster_path}" class="poster" onclick="openAddFromTrending('${m.id}', '${safeTitle}', '${m.poster_path}', '${m.backdrop_path}', '${safeOverview}')">
            `;
            list.appendChild(d);
        });
    }

    window.openAddFromTrending = (id, title, poster, backdrop, overview) => {
        tempItem = {
            title: title,
            poster: `https://image.tmdb.org/t/p/w500${poster}`,
            backdrop: `https://image.tmdb.org/t/p/original${backdrop}`,
            overview: overview,
            type: 'movie'
        };
        document.getElementById("add-type").value = "movie";
        document.getElementById("sel-title").innerText = title;
        document.getElementById("add-search-ui").style.display = "none";
        document.getElementById("search-res").innerHTML = "";
        document.getElementById("step-2").style.display = "block";
        document.getElementById("movie-options").style.display = "block";
        document.getElementById("series-msg").style.display = "none";
        window.openModal('add-modal');
    }

    // --- LIBRARY ---
    async function loadLib() {
        const q = query(moviesCol, orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        const grid = document.getElementById("grid-list");
        grid.innerHTML = ""; allMovies = [];

        if(snap.empty) { document.getElementById("empty-state").style.display="block"; return; }
        document.getElementById("empty-state").style.display="none";

        snap.forEach(docSnap => {
            const m = docSnap.data(); m.id = docSnap.id; allMovies.push(m);
            const d = document.createElement("div"); d.className = "poster-card";
            const badge = m.type === 'series' ? 'SERIES' : 'MOVIE';
            const action = m.type === 'series' ? `openSeriesView('${m.id}', '${m.tmdbID}')` : `play('${m.link}')`;
            d.innerHTML = `
                <div class="poster-badge">${badge}</div>
                <img src="${m.poster}" class="poster" onclick="${action}">
                <div class="delete-btn admin-only" onclick="deleteContent('${m.id}', event)">
                    <i class="fas fa-trash"></i>
                </div>
            `;
            grid.appendChild(d);
        });
        setupHero();
    }

    function setupHero() {
        if(allMovies.length > 0) {
            const r = allMovies[Math.floor(Math.random() * allMovies.length)];
            document.getElementById("hero").style.backgroundImage = `url('${r.backdrop || r.poster}')`;
            document.getElementById("hero-title").innerText = r.title;
            document.getElementById("hero-desc").innerText = r.overview;
            document.getElementById("hero-tag").innerText = r.type === 'series' ? 'TV SERIES' : 'MOVIE';
            if(r.type==='movie' && r.link) {
                const b = document.getElementById("hero-play");
                b.style.display = 'inline-flex';
                b.onclick = () => window.play(r.link);
            }
        }
    }

    // --- SEARCH ---
    window.searchContent = async () => {
        const q = document.getElementById("search-q").value; 
        const type = document.getElementById("add-type").value;
        const resDiv = document.getElementById("search-res"); 
        resDiv.innerHTML='<div style="color:#666; font-size:12px;">Searching...</div>';
        try {
            if(type==='movie') {
                const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB_KEY}&s=${encodeURIComponent(q)}&type=movie`);
                const d=await r.json(); if(d.Response==="False") throw new Error(); showRes(d.Search,'omdb');
            } else {
                const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`)}`;
                const r=await fetch(proxy); const d=await r.json(); showRes(d.results,'tmdb');
            }
        } catch(e) { resDiv.innerHTML='<div style="color:#666; font-size:12px;">Not found</div>'; }
    }

    function showRes(list,src) {
        const div=document.getElementById("search-res"); div.innerHTML="";
        list.slice(0,10).forEach(m=>{
            const img=document.createElement("img");
            let url=(src==='omdb')?m.Poster:(m.poster_path?`https://image.tmdb.org/t/p/w200${m.poster_path}`:"");
            if(url&&url!=="N/A") { 
                img.src=url; 
                img.style="height:110px; border-radius:8px; cursor:pointer; min-width:75px;"; 
                img.onclick=()=>selectItem(m,src); div.appendChild(img); 
            }
        });
    }

    window.selectItem=async(m,src)=>{
        try {
            if(src==='omdb') {
                const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB_KEY}&i=${m.imdbID}`); const d=await r.json();
                tempItem={title:d.Title,poster:d.Poster,backdrop:d.Poster,overview:d.Plot,type:'movie'};
            } else {
                const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.themoviedb.org/3/tv/${m.id}?api_key=${TMDB_KEY}`)}`;
                const r=await fetch(proxy); const d=await r.json();
                tempItem={title:d.name,poster:`https://image.tmdb.org/t/p/w500${d.poster_path}`,backdrop:`https://image.tmdb.org/t/p/original${d.backdrop_path}`,overview:d.overview,tmdbID:d.id,totalSeasons:d.number_of_seasons,type:'series'};
            }
            document.getElementById("sel-title").innerText=tempItem.title; 
            document.getElementById("add-search-ui").style.display="none";
            document.getElementById("search-res").innerHTML="";
            document.getElementById("step-2").style.display="block";
            const type=document.getElementById("add-type").value;
            if(type==='series'){ document.getElementById("movie-options").style.display='none'; document.getElementById("series-msg").style.display='block'; }
            else { document.getElementById("movie-options").style.display='block'; document.getElementById("series-msg").style.display='none'; }
        } catch(e) {}
    }

    window.resetAddModal = () => {
        document.getElementById("step-2").style.display="none";
        document.getElementById("add-search-ui").style.display="flex";
        document.getElementById("vid-link").value = "";
    }

    window.saveToDB = async () => {
        const type=document.getElementById("add-type").value;
        if(type==='movie') {
            const link=document.getElementById("vid-link").value; 
            if(link) finalize(link); else alert("Link required");
        } else finalize("");
    }

    async function finalize(link) {
        tempItem.link=link; tempItem.createdAt=Date.now();
        await addDoc(moviesCol, tempItem);
        window.closeModal("add-modal"); resetAddModal(); loadLib();
    }

    // --- SERIES ---
    window.openSeriesView = async (id, tmdb) => {
        activeSeriesID=id; activeTmdbID=tmdb;
        const docRef = doc(db, "movies", id);
        const docSnap = await getDoc(docRef);
        const d = docSnap.data();
        
        document.getElementById("s-backdrop").style.backgroundImage = `url('${d.backdrop}')`;
        document.getElementById("s-title").innerText = d.title;
        document.getElementById("s-desc").innerText = d.overview;
        
        const sel=document.getElementById("s-season"); sel.innerHTML="<option>Season...</option>";
        for(let i=1; i<=d.totalSeasons; i++) sel.innerHTML+=`<option value="${i}">Season ${i}</option>`;
        
        loadDbEps(); 
        document.getElementById("series-view").classList.add("active");
    }

    window.closeSeriesView=()=>{ document.getElementById("series-view").classList.remove("active"); }

    window.fetchTMDbEpisodes=async()=>{
        const s=document.getElementById("s-season").value; const epSel=document.getElementById("s-ep");
        try {
            const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.themoviedb.org/3/tv/${activeTmdbID}/season/${s}?api_key=${TMDB_KEY}`)}`;
            const r=await fetch(proxy); const d=await r.json();
            epSel.innerHTML="<option>Ep...</option>"; d.episodes.forEach(e=>epSel.innerHTML+=`<option value="${e.episode_number}|${e.name}">Ep ${e.episode_number}</option>`);
        } catch(e) {}
    }

    window.saveEp = async () => {
        const s=document.getElementById("s-season").value; const val=document.getElementById("s-ep").value; const link=document.getElementById("s-link").value;
        if(!link||val.includes("Ep...")) return;
        const [num,title]=val.split("|");
        const epCol = collection(db, "movies", activeSeriesID, "episodes");
        await addDoc(epCol, { season:parseInt(s), episode:parseInt(num), title:title, link:link });
        document.getElementById("s-link").value=""; loadDbEps();
    }

    async function loadDbEps() {
        const div=document.getElementById("ep-list"); div.innerHTML="Loading...";
        const epCol = collection(db, "movies", activeSeriesID, "episodes");
        const snap = await getDocs(epCol);
        
        div.innerHTML=""; 
        let eps=[]; snap.forEach(d=>eps.push({id:d.id,...d.data()}));
        eps.sort((a,b)=>(a.season-b.season)||(a.episode-b.episode));
        
        eps.forEach(e=>{ 
            div.innerHTML += `
                <div class="ep-card" onclick="play('${e.link}')">
                    <div style="width:30px;height:30px;border-radius:50%;background:white;color:black;display:flex;align-items:center;justify-content:center;"><i class="fas fa-play" style="font-size:10px;"></i></div>
                    <div style="flex:1;"><b>${e.episode}.</b> ${e.title}<div style="font-size:12px;color:#888;">S${e.season}</div></div>
                    <i class="fas fa-trash admin-only ep-delete" onclick="delEp('${e.id}', event)"></i>
                </div>`; 
        });
    }

    // --- PLAYER ---
    let isFit = false;
    window.play = (url) => {
        const p = document.getElementById("player"); const con = document.getElementById("vid-con");
        p.style.display = "block"; con.innerHTML = "";
        
        if(url.includes("youtu") || url.includes("drive.google")) {
            let src = url.includes("youtu") ? `https://www.youtube.com/embed/${url.split("v=")[1].split("&")[0]}?autoplay=1` : url.replace("/view", "/preview");
            con.innerHTML = `<iframe src="${src}" allowfullscreen style="width:100%; height:100%"></iframe>`;
            document.getElementById("player-toolbar").style.display = 'none';
        } else {
            document.getElementById("player-toolbar").style.display = 'flex';
            const v = document.createElement("video"); v.autoplay = true; v.controls = true; v.style.width="100%"; v.style.height="100%";
            if(url.includes(".m3u8") && Hls.isSupported()) { const h = new Hls(); h.loadSource(url); h.attachMedia(v); } else { v.src = url; }
            con.appendChild(v);
        }
    }

    window.setBrightness=(v)=>{ const el=document.querySelector("video, iframe"); if(el) el.style.filter=`brightness(${v})`; }
    window.toggleFit=()=>{ const v=document.querySelector("video"); if(v){ isFit=!isFit; v.style.objectFit = isFit ? "cover" : "contain"; } }
    window.closePlayer=()=>{ document.getElementById("player").style.display="none"; document.getElementById("vid-con").innerHTML=""; }

    // --- UTILS ---
    window.openModal=(id)=>{document.getElementById(id).style.display="flex"; setTimeout(()=>document.getElementById(id).classList.add('active'),10);}
    window.closeModal=(id)=>{document.getElementById(id).classList.remove('active'); setTimeout(()=>document.getElementById(id).style.display="none",300);}
    window.selectItem = selectItem;
    
    window.deleteContent = async (id, e) => {
        if(e) e.stopPropagation();
        if(confirm("Delete?")) { await deleteDoc(doc(db, "movies", id)); loadLib(); }
    };
    
    window.delEp = async (id, e) => {
        if(e) e.stopPropagation();
        if(confirm("Delete?")) { await deleteDoc(doc(db, "movies", activeSeriesID, "episodes", id)); loadDbEps(); }
    };

    window.addEventListener("scroll",()=>document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>50));
</script>
</body>
</html>
