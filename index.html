<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Amitflix</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    
    <!-- FONTS & ICONS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        :root { 
            --primary: #FF0055; 
            --bg: #050505; 
            --surface: #141414;
            --glass: rgba(20, 20, 20, 0.95);
            --text: #ffffff;
            --gradient-main: linear-gradient(135deg, #FF0055, #7928CA);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* --- ANIMATIONS --- */
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .poster-container { animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }

        /* --- LOADER --- */
        #app-loader { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 9999; display:flex; align-items:center; justify-content:center; flex-direction: column; transition: opacity 0.5s; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;}
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- INTRO --- */
        #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 9998; display: flex; align-items: center; justify-content: center; animation: fadeOutIntro 0.5s ease 2.5s forwards; pointer-events: none; }
        .intro-letter { font-family: 'Bebas Neue', sans-serif; font-size: 15rem; color: var(--primary); transform: scale(1); animation: netflixZoom 2.5s cubic-bezier(0.645, 0.045, 0.355, 1) forwards; text-shadow: 0 0 20px rgba(229, 9, 20, 0.5); }
        @keyframes netflixZoom { 0% { transform: scale(1); opacity: 0; } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1.5); } 100% { transform: scale(30); opacity: 0; } }
        @keyframes fadeOutIntro { to { opacity: 0; } }

        /* --- VISIBILITY --- */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: block !important; }
        #logout-btn { display: none; }
        body.is-admin #logout-btn { display: flex; }
        body.is-admin #login-btn { display: none; }

        /* --- NAVBAR --- */
        header { position: fixed; top: 0; width: 100%; height: 75px; z-index: 2000; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; transition: 0.3s ease; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%); }
        header.scrolled { background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { color: var(--primary); font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px; cursor:pointer; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.4)); }
        .nav-actions { display: flex; align-items: center; gap: 15px; }
        .nav-btn { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px); }
        .nav-btn i { color: white; font-size: 18px; }

        /* --- HERO --- */
        .hero { height: 75vh; width: 100%; position: relative; overflow: hidden; display: flex; align-items: flex-end; }
        .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 1s ease; z-index: 1; }
        .hero-video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .hero-video { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 1.5s ease; }
        .hero::after { content:''; position: absolute; inset:0; z-index: 2; background: linear-gradient(to top, var(--bg) 5%, transparent 60%), linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 50%); }
        .hero-content { position: relative; z-index: 10; padding: 0 5% 60px 5%; width: 100%; max-width: 900px; }
        .hero-tag { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #fff; margin-bottom: 15px; display: inline-block; background: var(--gradient-main); padding: 6px 12px; border-radius: 20px; box-shadow: 0 5px 15px rgba(255,0,85,0.3); }
        .hero-title { font-size: clamp(32px, 8vw, 70px); font-weight: 900; margin: 0 0 15px 0; line-height: 1.1; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .hero-desc { font-size: 15px; color: #ccc; max-width: 600px; line-height: 1.6; margin-bottom: 25px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .btn-play { padding: 14px 35px; background: white; color: black; border: none; font-weight: 800; border-radius: 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-size: 16px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 30px rgba(255,255,255,0.15); }
        .btn-play:hover { transform: scale(1.05); }

        /* --- SECTIONS --- */
        .section { padding: 0 5%; margin-bottom: 50px; position: relative; z-index: 20; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content:''; width: 4px; height: 24px; background: var(--primary); border-radius: 2px; box-shadow: 0 0 10px var(--primary); }
        .h-list { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 20px; min-height: 180px; align-items: flex-start; scroll-behavior: smooth; }
        .v-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 18px; row-gap: 30px; padding-bottom: 40px; }
        .poster-container { position: relative; flex-shrink: 0; transition: 0.3s; cursor: pointer; width: 130px; }
        .v-grid .poster-container { width: 100%; }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px; background: var(--surface); box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        .poster-container:hover .poster { transform: scale(1.05); border-color: var(--primary); }
        .poster-badge { position: absolute; top: 8px; left: 8px; background: var(--glass); backdrop-filter: blur(5px); color: var(--primary); font-size: 9px; padding: 4px 8px; border-radius: 6px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); }
        .poster-progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.3); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; overflow: hidden; }
        .poster-progress-bar { height: 100%; background: var(--primary); width: 0%; }
        
        /* CLEAN DELETE BTN (Inside Poster) */
        .delete-btn { 
            position: absolute; top: 6px; right: 6px; 
            width: 26px; height: 26px; 
            background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 11px; z-index: 50; cursor: pointer; 
            backdrop-filter: blur(4px); transition: 0.2s;
        }
        .delete-btn:hover { background: #FF0055; border-color: #FF0055; transform: scale(1.1); }

        /* --- MODALS --- */
        .modal { display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-box { background: #141414; width: 100%; max-width: 500px; padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity:0; transform:translateY(50px); } to { opacity:1; transform:translateY(0); } }
        input, select { width: 100%; padding: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; font-size: 16px; margin-bottom: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }
        .btn-main { width: 100%; padding: 16px; background: var(--gradient-main); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 10px 20px rgba(255, 0, 85, 0.3); transition: 0.3s; }
        
        /* STREAM SOURCES GRID */
        .source-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .source-btn { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); color: #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; text-align: center; }
        .source-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); color: white; }

        /* --- SERIES VIEW --- */
        .series-view { position: fixed; inset: 0; background: var(--bg); z-index: 6000; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); overflow-y: auto; }
        .series-view.active { transform: translateY(0); }
        .series-backdrop { height: 45vh; width: 100%; background-size: cover; background-position: center; position: relative; flex-shrink: 0; mask-image: linear-gradient(to bottom, var(--bg) 60%, transparent 100%); }
        .close-series { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; cursor: pointer; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .series-content { padding: 0 25px 50px 25px; margin-top: -80px; position: relative; z-index: 2; }
        .ep-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; position: relative; transition: 0.2s; }
        .ep-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
        .ep-delete { position: absolute; right: 10px; top: 10px; color: #666; font-size: 14px; padding: 10px; cursor: pointer; }

        /* SERIES UI FIX - NO GLITCH */
        .admin-panel { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; margin: 25px 0; border: 1px solid rgba(255,255,255,0.1); }
        .add-ep-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-bottom: 10px; }
        .add-ep-actions { display: flex; gap: 10px; }
        
        @media (max-width: 600px) {
            .add-ep-grid { grid-template-columns: 1fr; }
            .add-ep-actions { flex-direction: column; }
        }

        /* --- PLAYER --- */
        #player { background: black; z-index: 9999; display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; }
        #vid-con { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        video, iframe { width: 100%; height: 100%; border: none; }
        #player-toolbar { position: absolute; top: 25px; right: 25px; display: flex; align-items: center; gap: 20px; background: rgba(20,20,20,0.8); padding: 10px 20px; border-radius: 30px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        #player-close { position: absolute; top: 25px; left: 25px; width: 45px; height: 45px; background: rgba(20,20,20,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .tb-slider { width: 80px; -webkit-appearance: none; height: 4px; background: #666; border-radius: 2px; }
        .tb-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: white; border-radius: 50%; cursor: pointer; }
        #yt-fallback { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: #E50914; color: white; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 10005; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<div id="intro-overlay"><div class="intro-letter">A</div></div>
<div id="app-loader"><div class="spinner"></div></div>

<header id="navbar">
    <div class="logo" onclick="window.scrollTo(0,0)">AMITFLIX</div>
    <div class="nav-actions">
        <!-- ADMIN TOOLS -->
        <div class="nav-btn admin-only" onclick="openModal('add-modal')" title="Add Movie"><i class="fas fa-plus"></i></div>
        
        <!-- LOGIN / LOGOUT -->
        <div class="nav-btn" id="login-btn" onclick="openLoginModal()" title="Login"><i class="fas fa-user-lock"></i></div>
        <div class="nav-btn" id="logout-btn" onclick="firebaseLogout()" title="Logout"><i class="fas fa-sign-out-alt" style="color:var(--primary);"></i></div>
    </div>
</header>

<div class="hero" id="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-video-wrapper" id="hero-video-wrapper"></div>
    
    <div class="hero-content">
        <span class="hero-tag" id="hero-tag">FEATURED</span>
        <h1 class="hero-title" id="hero-title">Welcome</h1>
        <p class="hero-desc" id="hero-desc">Your personal library is ready.</p>
        <button onclick="playHero()" id="hero-play" class="btn-play" style="display:none;"><i class="fas fa-play"></i> Watch Now</button>
    </div>
</div>

<!-- CONTINUE WATCHING -->
<div class="section" id="continue-section" style="margin-top: -40px; display:none;">
    <div class="section-header">
        <span class="section-title">📺 Continue Watching</span>
    </div>
    <div class="h-list" id="continue-list"></div>
</div>

<!-- COLLECTION -->
<div class="section" id="main-collection">
    <div class="section-header">
        <span class="section-title">📂 My Collection</span>
        <i class="fas fa-sync-alt" onclick="loadLib()" style="color:#aaa; cursor:pointer;"></i>
    </div>
    <div class="v-grid" id="grid-list"></div>
    <div id="empty-state" style="text-align:center; padding: 40px; color:#666; display:none;">No content added.</div>
</div>

<!-- LOGIN MODAL -->
<div id="login-modal" class="modal">
    <div class="modal-box" style="text-align:center; max-width:350px;">
        <h2 style="margin-top:0; background:var(--gradient-main); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Admin Access</h2>
        <input type="email" id="email-input" placeholder="Email">
        <input type="password" id="password-input" placeholder="Password">
        <button class="btn-main" onclick="firebaseLogin()">Sign In</button>
        <div style="margin-top:15px; font-size:13px; color:#aaa; cursor:pointer;" onclick="closeModal('login-modal')">Cancel</div>
    </div>
</div>

<!-- ADD MODAL -->
<div id="add-modal" class="modal">
    <div class="modal-box">
        <h2 style="margin-top:0;">Add Content</h2>
        <div style="display:flex; gap:10px;">
            <select id="add-type"><option value="movie">Movie</option><option value="series">TV Series</option></select>
        </div>
        
        <div id="add-search-ui" style="display:flex; gap:10px;">
            <input id="search-q" placeholder="Search Title...">
            <button class="btn-main" onclick="searchContent()" style="width:auto;"><i class="fas fa-search"></i></button>
        </div>
        <div id="search-res" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:10px;"></div>
        
        <div id="step-2" style="display:none; margin-top:15px;">
            <p style="color:#aaa; font-size:13px;">Adding: <b id="sel-title" style="color:white"></b></p>
            <div id="movie-options">
                <input id="vid-link" placeholder="Paste Link (MP4/Drive)">
                <div style="text-align:center; margin-bottom:15px;">
                    <button class="btn-main" style="background:#222; font-size:12px; padding:10px;" onclick="toggleSourceList('movie-source-list')">🔍 Find Free Streams</button>
                </div>
                <div id="movie-source-list" class="source-grid" style="display:none;">
                    <div class="source-btn" onclick="openSourceSearch('yt')"><i class="fab fa-youtube" style="color:red;"></i> YouTube</div>
                    <div class="source-btn" onclick="openSourceSearch('archive')"><i class="fas fa-landmark" style="color:gold;"></i> Archive</div>
                    <div class="source-btn" onclick="openSourceSearch('google')"><i class="fab fa-google" style="color:white;"></i> Google</div>
                    <div class="source-btn" onclick="openSourceSearch('bing')"><i class="fas fa-search" style="color:skyblue;"></i> Bing</div>
                </div>
            </div>
            <div id="series-msg" style="display:none; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; font-size:13px; color:#ccc;">Creates a Series Folder.</div>
            
            <button class="btn-main" onclick="saveToDB()">Save to Library</button>
            <div style="text-align:center; margin-top:10px; font-size:12px; color:#666; cursor:pointer;" onclick="resetAddModal()">Cancel / Back</div>
        </div>
    </div>
</div>

<!-- SERIES VIEW -->
<div id="series-view" class="series-view">
    <div class="series-backdrop" id="s-backdrop"><div class="close-series" onclick="closeSeriesView()"><i class="fas fa-chevron-down"></i></div></div>
    <div class="series-content">
        <h1 class="series-title" id="s-title">Title</h1>
        <p id="s-desc" style="color:#aaa; line-height:1.5; font-size:14px;">...</p>
        
        <div class="admin-only admin-panel">
            <h4 style="margin:0 0 15px 0;">Add Episode</h4>
            
            <!-- STABLE GRID LAYOUT -->
            <div class="add-ep-grid">
                <select id="s-season" onchange="fetchTMDbEpisodes()"></select>
                <select id="s-ep"><option>Ep...</option></select>
            </div>
            
            <div class="add-ep-actions">
                <button class="btn-main" style="background:#222; font-size:12px; padding:10px; flex:1;" onclick="searchSeriesSources()">🔍 Search Stream</button>
                <input id="s-link" placeholder="Paste Link" style="flex:2; margin-bottom:0;">
                <button class="btn-main" onclick="saveEp()" style="width:auto; padding:0 30px;">Add</button>
            </div>
        </div>
        
        <h3 style="margin-bottom:15px;">Episodes</h3>
        <div id="ep-list" style="display:flex; flex-direction:column; gap:10px; padding-bottom:50px;"></div>
    </div>
</div>

<!-- PLAYER -->
<div id="player">
    <div id="player-close" onclick="closePlayer()"><i class="fas fa-arrow-left"></i></div>
    <div id="vid-con"></div>
    <div id="yt-fallback" onclick="openYouTube()"><i class="fab fa-youtube"></i> Watch on YouTube App</div>
    <div id="player-toolbar">
        <i class="fas fa-sun" style="color:white; font-size:14px;"></i>
        <input type="range" min="0.3" max="1.5" step="0.1" value="1" oninput="setBrightness(this.value)" style="width:80px; margin:0;">
        <i class="fas fa-expand" onclick="toggleFit()" style="color:white; font-size:16px; cursor:pointer;"></i>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const OMDB_KEY = "496d1395"; 
    const TMDB_KEY = "3fd2be6f0c70a2a598f084ddfb75487c";
    let db, storage, moviesCol, auth, activeSeriesID, activeTmdbID, activeSeriesTitle="", activeSeriesPoster="", allMovies=[], tempItem=null, currentYtLink="";

    const firebaseConfig = {
      apiKey: "AIzaSyBDZyw3vWpTuo3wKBFCtqqlbQfx1jHHqmc",
      authDomain: "movietheater-free.firebaseapp.com",
      projectId: "movietheater-free",
      storageBucket: "movietheater-free.firebasestorage.app",
      messagingSenderId: "632877715870",
      appId: "1:632877715870:web:de263eac9c902b5199c68f"
    };

    try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        storage = getStorage(app);
        moviesCol = collection(db, "movies");
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.body.classList.add("is-admin");
            } else {
                document.body.classList.remove("is-admin");
            }
        });

        loadLib();
        setTimeout(() => document.getElementById("app-loader")?.remove(), 2500);
    } catch(e) { console.error(e); }

    // --- AUTH UI ---
    window.openLoginModal = () => window.openModal('login-modal');
    window.firebaseLogin = async () => {
        try {
            await signInWithEmailAndPassword(auth, document.getElementById("email-input").value, document.getElementById("password-input").value);
            window.closeModal('login-modal');
            alert("Admin Access Granted.");
        } catch(e) { alert("Error: " + e.message); }
    }
    window.firebaseLogout = async () => { await signOut(auth); alert("Logged Out."); }

    // --- CONTINUE WATCHING ---
    function updateContinueWatching() {
        const list = document.getElementById("continue-list");
        const sec = document.getElementById("continue-section");
        const main = document.getElementById("main-collection");
        
        let watching = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('watch_progress_')) {
                const data = JSON.parse(localStorage.getItem(key));
                if(data.pct > 5 && data.pct < 95) watching.push(data);
            }
        }

        if(watching.length === 0) { 
            sec.style.display='none'; 
            main.style.marginTop = '-40px'; 
            return; 
        }
        
        sec.style.display='block';
        main.style.marginTop = '0px';
        list.innerHTML = "";
        
        watching.forEach(item => {
            const d = document.createElement("div"); d.className = "poster-container";
            d.style.width="130px";
            // Ensure poster URL is valid
            const posterSrc = item.poster || 'https://via.placeholder.com/150';
            
            d.innerHTML = `
                <img src="${posterSrc}" class="poster" onclick="play('${item.link}', null, '${item.id}')">
                <div class="poster-progress"><div class="poster-progress-bar" style="width:${item.pct}%"></div></div>
            `;
            list.appendChild(d);
        });
    }

    // --- HERO & TRAILER LOGIC ---
    async function setupHero() {
        if(allMovies.length > 0) {
            const r = allMovies[Math.floor(Math.random() * allMovies.length)];
            const bg = r.backdrop || r.poster;
            
            document.getElementById("hero-bg").style.backgroundImage = `url('${bg}')`;
            document.getElementById("hero-title").innerText = r.title;
            document.getElementById("hero-desc").innerText = r.overview;
            document.getElementById("hero-tag").innerText = r.type === 'series' ? 'TV SERIES' : 'MOVIE';

            if(r.type==='movie' && r.link) {
                const b = document.getElementById("hero-play");
                b.style.display = 'inline-flex';
                b.onclick = () => window.play(r.link, r.title, r.id, r.poster);
            }

            let tmdbId = r.tmdbID;
            if (!tmdbId && r.imdbID) {
                 try {
                    const findRes = await fetch(`https://api.themoviedb.org/3/find/${r.imdbID}?api_key=${TMDB_KEY}&external_source=imdb_id`);
                    const findData = await findRes.json();
                    if (findData.movie_results.length > 0) tmdbId = findData.movie_results[0].id;
                    else if (findData.tv_results.length > 0) tmdbId = findData.tv_results[0].id;
                 } catch(e) {}
            }

            if(tmdbId) {
                try {
                    const typePath = r.type === 'series' ? 'tv' : 'movie';
                    const res = await fetch(`https://api.themoviedb.org/3/${typePath}/${tmdbId}/videos?api_key=${TMDB_KEY}`);
                    const data = await res.json();
                    const trailer = data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube') || data.results[0];
                    if(trailer) {
                        const wrapper = document.getElementById("hero-video-wrapper");
                        wrapper.innerHTML = `<iframe class="hero-video" src="https://www.youtube.com/embed/${trailer.key}?autoplay=1&mute=1&controls=0&loop=1&playlist=${trailer.key}&start=10" frameborder="0" allow="autoplay; encrypted-media" style="width:100%; height:100%; object-fit:cover;"></iframe>`;
                        document.getElementById("hero-video").style.opacity = "1";
                    }
                } catch(e) {}
            }
        }
    }

    // --- LIBRARY ---
    async function loadLib() {
        const q = query(moviesCol, orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        const grid = document.getElementById("grid-list");
        grid.innerHTML = ""; allMovies = [];

        if(snap.empty) { document.getElementById("empty-state").style.display="block"; return; }
        document.getElementById("empty-state").style.display="none";

        snap.forEach(docSnap => {
            const m = docSnap.data(); m.id = docSnap.id; allMovies.push(m);
            const d = document.createElement("div"); d.className = "poster-container";
            const badge = m.type === 'series' ? 'SERIES' : 'MOVIE';
            const action = m.type === 'series' ? `openSeriesView('${m.id}', '${m.tmdbID}')` : `play('${m.link}', '${m.title}', '${m.id}', '${m.poster}')`;
            
            d.innerHTML = `
                <div class="poster-badge">${badge}</div>
                <img src="${m.poster}" class="poster" onclick="${action}">
                <div class="delete-btn admin-only" onclick="deleteContent('${m.id}', event)">
                    <i class="fas fa-trash"></i>
                </div>
            `;
            grid.appendChild(d);
        });
        setupHero();
        updateContinueWatching();
    }

    // --- SEARCH & ADD ---
    window.searchContent = async () => {
        const q = document.getElementById("search-q").value; 
        const type = document.getElementById("add-type").value;
        const resDiv = document.getElementById("search-res"); 
        resDiv.innerHTML='<div style="color:#666; font-size:12px;">Searching...</div>';
        try {
            if(type==='movie') {
                const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB_KEY}&s=${encodeURIComponent(q)}&type=movie`); const d=await r.json(); if(d.Response==="False") throw new Error(); showRes(d.Search,'omdb');
            } else {
                const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`)}`;
                const r=await fetch(proxy); const d=await r.json(); showRes(d.results,'tmdb');
            }
        } catch(e) { resDiv.innerHTML='<div style="color:#666; font-size:12px;">Not found</div>'; }
    }

    function showRes(list,src) {
        const div=document.getElementById("search-res"); div.innerHTML="";
        list.slice(0,10).forEach(m=>{
            const img=document.createElement("img");
            let url=(src==='omdb')?m.Poster:(m.poster_path?`https://image.tmdb.org/t/p/w200${m.poster_path}`:"");
            if(url&&url!=="N/A") { 
                img.src=url; img.style="height:110px; border-radius:8px; cursor:pointer; min-width:75px;"; 
                img.onclick=()=>selectItem(m,src); div.appendChild(img); 
            }
        });
    }

        } catch(e) {}
    }
